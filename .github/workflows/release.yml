name: release

on:
  push:
    tags: ["v*"]

# Deliberately NOT published to PyPI. This package is transitional - it exists
# until glyphsLib reads format 4 - and a PyPI name cannot be freed again once
# taken, so claiming one for something meant to be deleted is the wrong trade.
# The wheel is attached to a GitHub Release instead, and consumers pin the
# asset URL:
#
#   glyphs4to3 @ https://github.com/displaay/glyphs4to3/releases/download/v0.1.0/glyphs4to3-0.1.0-py3-none-any.whl
#
# pip fetches a built wheel over plain HTTPS, so the build image needs no git
# and the download caches like any other wheel. If this ever turns out to be
# permanent, publishing to PyPI is still available later.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Safety net: never release a tag whose tests fail. The full matrix runs
      # in ci.yml on every push to main; this is a single-version smoke run.
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Check the tag matches the packaged version
        run: |
          version="$(python -c 'import glyphs4to3; print(glyphs4to3.__version__)')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ $version" >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - name: Publish the wheel as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
